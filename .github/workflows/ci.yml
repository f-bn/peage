---
name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.goreleaser.yaml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.goreleaser.yaml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7.2.2
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=docker

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peage-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
